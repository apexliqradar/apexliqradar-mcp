[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apexliqradar-mcp"
version = "1.0.0"
description = "Official MCP client bridge for ApexLiqRadar multi-chain Aave V3 liquidation telemetry and x402 pre-simulated calldata."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0"
]

[project.scripts]
apexliqradar-mcp = "server:main"
